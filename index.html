<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nove1 - Estética Automotiva</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <header>
        <img src="image_2.png" alt="Nove1 Estética Automotiva" class="logo-header">
        <nav>
            <button onclick="showTab('entrada', this)" class="active">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                ENTRADA
            </button>
            <button onclick="showTab('patio', this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                PÁTIO <span id="badge-patio" class="badge-count">0</span>
            </button>
            <button onclick="showTab('historico', this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                HISTÓRICO
            </button>
            <button onclick="showTab('relatorios', this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                RELATÓRIOS
            </button>
        </nav>
    </header>

    <main>
        <section id="entrada" class="tab active">
            <h2>Registrar Entrada</h2>
            <form id="form-entrada">
                <input type="text" id="placa" placeholder="Placa (ex: ABC-1234)" required autocomplete="off">
                <select id="tipo" required>
                    <option value="" disabled selected>Tipo de Veículo</option>
                    <option value="moto">Moto (R$ 2,00/h)</option>
                    <option value="carro">Carro (R$ 4,00/h)</option>
                    <option value="carro_grande">Carro Grande (R$ 6,00/h)</option>
                </select>
                <input type="text" id="hora-entrada" placeholder="Horário de Entrada" onfocus="this.type='time'; this.value = new Date().toTimeString().substring(0,5);" required>
                <button type="submit" class="btn-success">Salvar Entrada</button>
                <button type="button" onclick="imprimirTicketEntrada()">Imprimir Ticket de Entrada</button>
            </form>
        </section>

        <section id="patio" class="tab">
            <h2>Veículos no Pátio</h2>
            <div id="lista-patio"></div>
        </section>

        <section id="historico" class="tab">
            <h2>Histórico por Data</h2>
            <input type="date" id="data-historico" onchange="atualizarHistorico()">
            <div class="resumo-dia" style="margin-top: 15px;">TOTAL: R$ <span id="total-dia">0.00</span></div>
            <div id="lista-historico" style="margin-top: 15px;"></div>
            <button onclick="gerarPDFDia()" style="margin-top: 15px; width: 100%;" class="btn-success">Exportar Relatório PDF</button>
            <button onclick="limparHistorico()" class="btn-danger" style="margin-top: 10px; width: 100%;">Limpar Histórico</button>
        </section>

        <section id="relatorios" class="tab">
            <h2>Relatório por Período</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <label>Data Inicial:</label>
                <input type="date" id="data-inicio" onchange="calcularRelatorioPeriodo()">
                <label>Data Final:</label>
                <input type="date" id="data-fim" onchange="calcularRelatorioPeriodo()">
            </div>
            <div class="resumo-dia">TOTAL DO PERÍODO: R$ <span id="total-periodo">0.00</span></div>
            <div id="lista-periodo" style="margin-top: 15px;"></div>
            <button onclick="gerarPDFPeriodo()" style="margin-top: 15px; width: 100%;" class="btn-success">Exportar Período em PDF</button>
        </section>
    </main>

    <footer class="rodape-brabo">
        <p>• Criado por 𝕄𝕣𝕝•𝕄𝕒𝕣𝕢𝕦𝕖𝕤 •</p>
    </footer>

    <!-- MODAL DE SAÍDA -->
    <div id="modal-saida" class="modal">
        <div class="modal-content">
            <h3>Registrar Saída: <span id="modal-placa"></span></h3>
            <input type="time" id="hora-saida">
            <input type="number" id="desconto" placeholder="Aplicar desconto (R$)" step="0.50">
            <select id="pagamento">
                <option value="pix">PIX</option>
                <option value="cartao">Cartão</option>
                <option value="dinheiro">Dinheiro</option>
            </select>
            <div class="resumo-dia" style="font-size: 1em; margin: 0;">Total a pagar: R$ <span id="valor-calculado">0.00</span></div>
            <button onclick="calcularValor()">Calcular Valor</button>
            <button onclick="finalizarSaida()" class="btn-success">Finalizar e Receber</button>
            <button onclick="fecharModal()" class="btn-danger">Cancelar</button>
        </div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO -->
    <div id="modal-confirm" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h3 id="confirm-msg" style="margin-bottom: 20px; font-size: 1em; color: var(--text-color);"></h3>
            <div style="display: flex; gap: 10px;">
                <button id="btn-confirm-yes" class="btn-success" style="flex: 1;">SIM</button>
                <button onclick="fecharConfirm()" class="btn-danger" style="flex: 1;">NÃO</button>
            </div>
        </div>
    </div>

    <!-- CONTÊINER DOS TOASTS -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
